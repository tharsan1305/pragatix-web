<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/sg-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://pragatix.in https://www.pragatix.in http://localhost:8080 ws://localhost:5173; connect-src 'self' https://pragatix.in wss://pragatix.in https://www.pragatix.in wss://www.pragatix.in http://localhost:8080 ws://localhost:5173 wss://localhost:5173 https://challenges.cloudflare.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://pragatix.in https://www.pragatix.in http://localhost:8080;" />
    <title>PragatiX</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        font-family: system-ui, -apple-system, sans-serif;
        color: #ffffff;
      }
      .loader-logo-wrapper {
        position: relative;
        width: 110px;
        height: 110px;
        margin-bottom: 20px;
      }
      .loader-logo-bg {
        position: absolute;
        inset: -12px;
        border-radius: 24px;
        background: radial-gradient(circle, rgba(249, 115, 22, 0.4) 0%, rgba(239, 68, 68, 0.1) 70%);
        animation: pulse 1.8s infinite ease-in-out;
      }
      .loader-logo-img {
        position: relative;
        z-index: 10;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #ffffff;
        border-radius: 20px;
        padding: 12px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      }
      .loader-spinner {
        position: absolute;
        inset: -6px;
        z-index: 15;
        border-radius: 24px;
        border: 3px solid transparent;
        border-top-color: #f97316;
        border-right-color: #ef4444;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; transform: scale(0.96); }
        50% { opacity: 0.95; transform: scale(1.04); }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="initial-loader">
      <div class="loader-logo-wrapper">
        <div class="loader-logo-bg"></div>
        <img src="/loader-logo.png" alt="PragatiX Logo" class="loader-logo-img" />
        <div class="loader-spinner"></div>
      </div>
      <div style="font-weight: 700; font-size: 1.25rem; letter-spacing: 0.5px; margin-bottom: 6px; background: linear-gradient(to right, #f97316, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">PragatiX</div>
      <div style="font-size: 0.875rem; color: #94a3b8; font-weight: 500;">Loading application...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          setTimeout(() => {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.4s ease';
            setTimeout(() => loader.remove(), 400);
          }, 300);
        }
      });
    </script>
  </body>
</html>
